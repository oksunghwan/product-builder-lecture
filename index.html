<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로또 번호 추천기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0000FF;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #FFFFFF;
            border: 4px solid #000000;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 12px 12px 0 #000000;
        }

        h1 {
            background: #000000;
            color: #FFFFFF;
            padding: 20px;
            font-size: 32px;
            font-weight: bold;
            border-bottom: 4px solid #000000;
            text-transform: uppercase;
        }

        .content {
            padding: 30px;
        }

        .button {
            background: #FFFF00;
            color: #000000;
            border: 4px solid #000000;
            padding: 20px 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 6px 6px 0 #000000;
            transition: all 0.1s;
            width: 100%;
            margin-bottom: 30px;
        }

        .button:hover {
            background: #FFD700;
        }

        .button:active {
            box-shadow: 3px 3px 0 #000000;
            transform: translate(3px, 3px);
        }

        .lotto-set {
            background: #FFFFFF;
            border: 3px solid #000000;
            padding: 20px;
            margin-bottom: 20px;
        }

        .set-label {
            color: #000000;
            font-size: 16px;
            margin-bottom: 15px;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 2px solid #000000;
            padding-bottom: 10px;
        }

        .numbers {
            display: flex;
            justify-content: space-around;
            gap: 10px;
            flex-wrap: wrap;
        }

        .number {
            width: 60px;
            height: 60px;
            border: 3px solid #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: #000000;
            background: #FFFFFF;
            box-shadow: 4px 4px 0 #000000;
        }

        .number:nth-child(1) { background: #FF0000; color: #FFFFFF; }
        .number:nth-child(2) { background: #00FF00; color: #000000; }
        .number:nth-child(3) { background: #0000FF; color: #FFFFFF; }
        .number:nth-child(4) { background: #FFFF00; color: #000000; }
        .number:nth-child(5) { background: #FF00FF; color: #FFFFFF; }
        .number:nth-child(6) { background: #00FFFF; color: #000000; }

        .message {
            margin-top: 30px;
            padding: 15px;
            background: #000000;
            color: #FFFFFF;
            font-size: 14px;
            text-align: center;
            border: 3px solid #000000;
            text-transform: uppercase;
            font-weight: bold;
        }

        #lottoSets {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎲 LOTTO NUMBER GENERATOR</h1>
        <div class="content">
            <button class="button" onclick="generateLotto()">Generate 5 Sets</button>
            <div id="lottoSets"></div>
            <div class="message">Good Luck!</div>
        </div>
    </div>

    <script>
        function generateOneLottoSet() {
            const numbers = [];
            while(numbers.length < 6) {
                const num = Math.floor(Math.random() * 45) + 1;
                if(!numbers.includes(num)) {
                    numbers.push(num);
                }
            }
            return numbers.sort((a, b) => a - b);
        }

        function generateLotto() {
            const lottoSetsDiv = document.getElementById('lottoSets');
            lottoSetsDiv.innerHTML = '';
            
            for(let i = 1; i <= 5; i++) {
                const setDiv = document.createElement('div');
                setDiv.className = 'lotto-set';
                
                const labelDiv = document.createElement('div');
                labelDiv.className = 'set-label';
                labelDiv.textContent = `Set ${i}`;
                setDiv.appendChild(labelDiv);
                
                const numbersDiv = document.createElement('div');
                numbersDiv.className = 'numbers';
                
                const numbers = generateOneLottoSet();
                
                numbers.forEach(num => {
                    const numberDiv = document.createElement('div');
                    numberDiv.className = 'number';
                    numberDiv.textContent = num;
                    numbersDiv.appendChild(numberDiv);
                });
                
                setDiv.appendChild(numbersDiv);
                lottoSetsDiv.appendChild(setDiv);
            }
        }
    </script>
</body>
</html>
